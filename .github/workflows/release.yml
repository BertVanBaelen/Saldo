name: Release

# Publishes the add-on version in saldo/config.yaml once CI has passed on main.
# Home Assistant reads that version from main and pulls
# ghcr.io/<owner>/saldo:<version>, so the image is pushed first, then the
# commit is tagged v<version> with its notes from saldo/CHANGELOG.md.
# A version that is already tagged, or that ends in -dev, is skipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version and its notes
        id: version
        run: |
          version="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' saldo/config.yaml)"
          test -n "$version" || { echo "::error::No version in saldo/config.yaml"; exit 1; }
          awk -v v="## $version" '$0==v{on=1;next} /^## /{on=0} on' saldo/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "::error::No notes for $version in saldo/CHANGELOG.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/saldo" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-dev ]]; then
            echo "$version is a development version, nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.new == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: steps.version.outputs.new == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.new == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Tag and publish the release notes
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA"
          --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"